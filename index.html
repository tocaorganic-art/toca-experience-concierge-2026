<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Toca Experience | Concierge & Lifestyle Premium</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Toca Experience: concierge e lifestyle premium para estadias em casas de alto padrão no litoral do Brasil. Curadoria de experiências, roteiros exclusivos e atendimento dedicado."
    />
    <meta
      name="keywords"
      content="concierge, lifestyle, luxo, casa de alto padrão, aluguel de temporada, experiências exclusivas, Toca Experience"
    />
    <meta name="author" content="Toca Experience" />
    <meta name="theme-color" content="#060606" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Toca Experience" />
    <meta property="og:title" content="Toca Experience | Concierge & Lifestyle Premium" />
    <meta
      property="og:description"
      content="Curadoria de experiências luxuosas, personalização total e equipes dedicadas para sua estadia perfeita."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Toca Experience | Concierge & Lifestyle Premium" />
    <meta
      name="twitter:description"
      content="Curadoria de experiências luxuosas, personalização total e equipes dedicadas para sua estadia perfeita."
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Toca Experience",
        "description": "Concierge e lifestyle premium para estadias em casas de alto padrão no litoral do Brasil.",
        "areaServed": "BR",
        "knowsLanguage": ["pt-BR", "es", "en"]
      }
    </script>

    <!-- Google Fonts: Playfair Display for titles and Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    
    <style>
      :root {
        --font-serif: 'Playfair Display', serif;
        --font-sans: 'Inter', sans-serif;
      }
      body {
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
      }
      h1, h2, h3, h4, h5, h6, .font-serif {
        font-family: var(--font-serif);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/src/main.tsx"></script>
  </body>
</html>
